<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inbox Zero Celebration!</title>
  <script src="confetti.browser.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }
    #celebrateBtn {
      padding: 20px 40px;
      font-size: 28px;
      color: white;
      background-color: #e74c3c;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s;
      z-index: 1000;
    }
    #celebrateBtn:hover {
      transform: scale(1.05);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <button id="celebrateBtn">🎉 Inbox Zero! 🎉</button>
  <canvas id="canvas"></canvas>
  <audio id="fanfare">
    <source src="Success_Fanfare_Trumpets.mp3" type="audio/mp3">
  </audio>

  <script>
    const button = document.getElementById('celebrateBtn');
    const audio = document.getElementById('fanfare');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let envelopes = [];
    let animationFrameId;

    function createEnvelopes(count) {
      envelopes = [];
      for(let i = 0; i < count; i++) {
        envelopes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          rotation: Math.random() * 360,
          vr: (Math.random() - 0.5) * 10,
          size: 25 + Math.random() * 15
        });
      }
    }

    function drawEnvelopes() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      envelopes.forEach(env => {
        ctx.save();
        ctx.translate(env.x, env.y);
        ctx.rotate(env.rotation * Math.PI / 180);
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#ccc';
        ctx.fillRect(-env.size/2, -env.size/4, env.size, env.size/2);
        ctx.strokeRect(-env.size/2, -env.size/4, env.size, env.size/2);
        ctx.beginPath();
        ctx.moveTo(-env.size/2, -env.size/4);
        ctx.lineTo(0, 0);
        ctx.lineTo(env.size/2, -env.size/4);
        ctx.stroke();
        ctx.restore();

        env.x += env.vx;
        env.y += env.vy;
        env.rotation += env.vr;

        if (env.x <= 0 || env.x >= canvas.width) env.vx *= -1;
        if (env.y <= 0 || env.y >= canvas.height) env.vy *= -1;
      });

      animationFrameId = requestAnimationFrame(drawEnvelopes);
    }

    function triggerConfetti() {
      const colors = [
        '#ff0a54', '#ff477e', '#ff7096', '#ff85a1',
        '#fbb1bd', '#f9bec7', '#00ffae', '#00b4d8',
        '#0077b6', '#8338ec', '#ffbe0b', '#ff595e',
        '#8ac926', '#1982c4', '#6a4c93', '#ffca3a'
      ];

      const shapes = ['star', 'circle', 'square'];

      const defaults = {
        particleCount: 500,
        spread: 360,
        startVelocity: 90,
        gravity: 0.2,
        ticks: 600,
        scalar: 1.5,
        zIndex: 999,
        colors: colors,
        shapes: shapes,
      };

      // Center Massive Blast
      confetti({
        ...defaults,
        particleCount: 600,
        origin: { x: 0.5, y: 0.5 },
        startVelocity: 120,
        scalar: 1.8,
      });

      // Left and Right cannons
      confetti({
        ...defaults,
        particleCount: 350,
        origin: { x: 0, y: 0.8 },
        angle: 60,
        drift: 2,
      });

      confetti({
        ...defaults,
        particleCount: 350,
        origin: { x: 1, y: 0.8 },
        angle: 120,
        drift: -2,
      });

      // Continuous rainbow drizzle from the top!
      const duration = 3 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 15,
          angle: Math.random() * 360,
          spread: 180,
          origin: { x: Math.random(), y: 0 },
          colors: colors,
          shapes: ['star', 'circle'],
          gravity: 0.1,
          ticks: 300,
          scalar: Math.random() * 1.2 + 0.8,
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }


    function resetCelebration() {
      cancelAnimationFrame(animationFrameId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      button.style.display = 'block';
    }

    button.addEventListener('click', () => {
      // Handle browser audio restrictions
      audio.play().catch((e) => {
        console.warn("Audio playback prevented:", e);
      });

      button.style.display = 'none';
      createEnvelopes(500); // Increased envelopes
      drawEnvelopes();
      triggerConfetti();

      setTimeout(resetCelebration, 5000); // Reset after 5 seconds
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
